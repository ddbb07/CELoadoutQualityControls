---
on:
  push:
    branches:
      - main
    paths:
      - data/About/About.xml

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag new version
        id: tag
        run: |
          version="$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          print(ET.parse("data/About/About.xml").findtext("modVersion", ""))
          EOF
          )"
          if [ -z "${version}" ]; then
            echo "No modVersion in data/About/About.xml"
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already tagged"
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.tag.outputs.tag }}
