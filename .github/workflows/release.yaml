---
on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check tag against version
        run: |
          version="$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          print(ET.parse("data/About/About.xml").findtext("modVersion", ""))
          EOF
          )"
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} doesn't match the mod version v${version}"
            exit 1
          fi
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: src/obj/*/CombatExtended
          key: combatextended-${{ hashFiles('src/CELoadoutQualityControls.csproj') }}
      - name: Install preview tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-inter
      - name: Build
        run: dotnet build src -c Release -t:Zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" out/*.zip --generate-notes
